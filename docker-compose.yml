x-env: &env
  env_file: .env

x-node: &node
  <<: *env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    meilisearch: { condition: service_healthy }
    minio: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    ports: ["127.0.0.1:7700:7700"]
    volumes: [meili:/meili_data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # Official minio/minio images are no longer published on Docker Hub/quay (pull denied);
    # chainguard/minio is a MinIO build with the same S3 API. It has no shell, so no container healthcheck:
    # services retry S3 connection themselves.
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio:/data]

  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  api1: &api
    <<: *node
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: api } }
    environment: { PORT: "3001", INSTANCE_ID: api1 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  api2:
    <<: *api
    environment: { PORT: "3001", INSTANCE_ID: api2 }

  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api1, api2]

  worker:
    <<: *node
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: worker } }
    depends_on:
      api1: { condition: service_healthy }

  web:
    <<: *env
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: web } }
    restart: unless-stopped
    environment: { PORT: "3000" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [nginx]

volumes:
  pgdata:
  meili:
  minio:
