name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm gen:check
      - run: pnpm --filter @auction/web build
      - run: pnpm test
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: auction, POSTGRES_PASSWORD: auction_dev_password, POSTGRES_DB: auction_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U auction" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://auction:auction_dev_password@127.0.0.1:5433/auction_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Start Meilisearch, MinIO and Mailpit
        run: |
          docker run -d --name meili -p 127.0.0.1:7700:7700 -e MEILI_MASTER_KEY=dev_meili_master_key_change_me_32chars -e MEILI_ENV=development getmeili/meilisearch:v1.11
          docker run -d --name minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=minio_dev_access -e MINIO_ROOT_PASSWORD=minio_dev_secret_key chainguard/minio:latest server /data
          docker run -d --name mail -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit:latest
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7700/health >/dev/null && break
            sleep 1
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Start full stack with Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null \
              && curl -sf http://127.0.0.1:3000/uk >/dev/null \
              && docker compose logs worker | grep -q "worker started"; then
              break
            fi
            sleep 3
          done
          curl -sf http://127.0.0.1:8080/health
          docker compose logs worker | grep -q "worker started"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm e2e
      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v
